services:
  - type: web
    name: promoshop
    runtime: docker
    plan: pro
    region: virginia
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://promoshop.jhonatafaraujo.com.br
      - key: PUBLIC_URL
        value: https://promoshop.jhonatafaraujo.com.br
      - key: ADMIN_PASSWORD
        sync: false
      # Cloudflare Turnstile: site key é pública, secret key permanece no Render.
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Formulário de contato enviado pelo Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: contatopromoshop.site@gmail.com
      - key: BREVO_SENDER_NAME
        value: PromoShop
      - key: CONTACT_EMAIL
        value: contatopromoshop.site@gmail.com
      - key: DATA_DIR
        value: /var/data
      - key: STORE_BACKEND
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: CHROME_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: WHATSAPP_AUTOSTART
        value: "false"
      # Recicla somente o processo do WhatsApp após entregas suficientes para
      # liberar memória do Chromium, sem reiniciar a API nem alterar a fila.
      - key: WHATSAPP_RECYCLE_AFTER_MESSAGES
        value: "100"
      # Opcional: destinatário dos alertas operacionais do servidor.
      - key: MONITORING_WHATSAPP_RECIPIENT
        sync: false
      # O WhatsApp usa uma sessão única no disco persistente.
      # Mais de um processo causa disputa pelo Chromium e pela sessão.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: NODE_OPTIONS
        value: --max-old-space-size=768
      - key: AUTH_SECRET
        generateValue: true
      - key: SECRETS_ENCRYPTION_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
    disk:
      name: promoshop-data
      mountPath: /var/data
      sizeGB: 5
