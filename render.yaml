services:
  - type: web
    name: promoshop
    runtime: docker
    plan: starter
    region: virginia
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        value: https://promoshop.onrender.com
      - key: ADMIN_PASSWORD
        sync: false
      # Formulário de contato enviado pelo Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: contatopromoshop.site@gmail.com
      - key: BREVO_SENDER_NAME
        value: PromoShop
      - key: CONTACT_EMAIL
        value: contatopromoshop.site@gmail.com
      - key: DATA_DIR
        value: /var/data
      - key: CHROME_PATH
        value: /usr/bin/chromium
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: WHATSAPP_AUTOSTART
        value: "true"
      # O WhatsApp usa uma sessão única no disco persistente.
      # Mais de um processo causa disputa pelo Chromium e pela sessão.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: NODE_OPTIONS
        value: --max-old-space-size=768
      - key: AUTH_SECRET
        generateValue: true
    disk:
      name: promoshop-data
      mountPath: /var/data
      sizeGB: 1
