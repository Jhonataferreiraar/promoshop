name: Security checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O teste de rotas HTML usa o pacote de produção gerado pelo Vite.
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:secret-scan
      - run: npm run test:safe-remote
      - run: npm run test:secrets
      - run: npm run test:data-encryption
      - run: npm run test:security
      - run: npm run test:auth-cookies
      - run: npm run test:postgres
      - run: npm run test:search
      - run: npm run test:routing
      - run: npm run test:messages
      - run: npm run test:group-directory
      - run: npm run test:whatsapp-media
      - run: npm run test:whatsapp-patch
      - run: npm run test:whatsapp-process
      - run: npm run test:whatsapp-schedule
      - run: npm run test:whatsapp-mentions
      - run: npm run test:whatsapp-dedup
      - run: npm run test:instagram
      - run: npm run test:store
      - run: npm run test:extension
