name: Security checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O teste de rotas HTML usa o pacote de produção gerado pelo Vite.
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:secret-scan
      - run: npm run test:safe-remote
      - run: npm run test:secrets
      - run: npm run test:data-encryption
      - run: npm run test:security
      - run: npm run test:auth-cookies
      - run: npm run test:postgres
