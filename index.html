<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Encontre ofertas diárias e cupons selecionados do Mercado Livre, Shopee, AliExpress e Magalu. Confirme as condições diretamente na loja." />
    <meta name="theme-color" content="#1269f3" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      (() => {
        try {
          const allowed = ['system', 'light', 'dark'];
          const preference = allowed.includes(localStorage.getItem('promoshop_theme'))
            ? localStorage.getItem('promoshop_theme')
            : 'light';
          const dark = preference === 'dark'
            || (preference === 'system' && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch { }
      })();
    </script>
    <title>PromoShop - Ofertas Diárias</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
